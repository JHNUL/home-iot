services:
  database:
    image: timescale/timescaledb:2.24.0-pg17@sha256:8ab414f7f73fd47dfa643097f1a753e2ac009c70fcb0de5717d0e79d21e7b7d6
    ports:
      - "54322:5432"
    env_file:
      - db.env
    volumes:
      - homeserver-db-data:/var/lib/postgresql/data
    networks:
      - homeserver-network

  kc-database:
    image: postgres:17.7-trixie@sha256:bac8128cd62a35471a1e97966861aa2ac88c8d2f408767a425ae70695a607c99
    ports:
      - "54321:5431"
    env_file:
      - kc-db.env
    volumes:
      - homeserver-kc-db-data:/var/lib/postgresql/data
    networks:
      - homeserver-network

  broker:
    image: eclipse-mosquitto:2.0.22@sha256:077fe4ff4c49df1e860c98335c77dda08360629e0e2a718147027e4db3eace9d
    ports:
      - "1883:1883"
    volumes:
      - homeserver-broker-data:/mosquitto/data
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - homeserver-network

  liquibase:
    image: juhanir/liquibase-migrator:1.0.3
    depends_on:
      - database
    volumes:
      - ../homeserver-database/changelog:/liquibase/changelog
    env_file:
      - liquibase.env
    command: >
      bash -c "/wait-for-db.sh && liquibase --changeLogFile=db.changelog.xml update"
    networks:
      - homeserver-network

  keycloak:
    image: juhanir/homeserver-keycloak:1.0.1
    depends_on:
      - kc-database
    ports:
      - "8888:8888"
    volumes:
      - ./homeserver-realm-dev.json:/opt/keycloak/data/import/realm-import.json
    env_file:
      - keycloak.env
    command: start --verbose --import-realm --optimized
    networks:
      - homeserver-network
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      retries: 5
      start_period: 15s
      timeout: 10s

volumes:
  homeserver-db-data:
  homeserver-kc-db-data:
  homeserver-broker-data:

networks:
  homeserver-network:
    driver: bridge
